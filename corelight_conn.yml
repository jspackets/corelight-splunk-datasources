name: Corelight conn
id: 4da66cd1-cd0a-4b9f-a5ad-b15809a6d82c
version: 1
date: "2025-05-02"
author: Jon Scher, Corelight
description:
  Logs network connection metadata captured by Zeek (formerly Bro), including
  details such as source and destination IPs, ports, connection state, and protocol.
mitre_components:
  - Network Connection Creation
  - Network Traffic Flow
  - Response Metadata
  - Application Log Content
source: corelight:conn:json
sourcetype: corelight_conn
supported_TA:
  - name: TA for Corelight
    url: https://splunkbase.splunk.com/app/3885
    version: 2.5.4
fields:
  - action
  - bytes
  - bytes_in
  - bytes_out
  - conn_state
  - conn_state_meaning
  - dest
  - dest_host
  - dest_ip
  - dest_port
  - duration
  - dvc
  - flow_id
  - history
  - id.orig_h
  - id.orig_p
  - id.resp_h
  - id.resp_p
  - id_orig_h
  - id_orig_p
  - id_resp_h
  - id_resp_p
  - is_broadcast
  - is_dest_internal_ip
  - is_src_internal_ip
  - local_orig
  - local_resp
  - missed_bytes
  - orig_bytes
  - orig_ip_bytes
  - orig_pkts
  - packets
  - packets_in
  - packets_out
  - product:
  - proto
  - resp_bytes
  - resp_ip_bytes
  - resp_pkts
  - sensor_name
  - src
  - src_ip
  - src_port
  - tcp_flag
  - transport
  - ts
  - tunnel_parents
  - uid
  - vendor
  - vendor_product
output_fields:
  - action
  - dest
  - dest_ip
  - dest_port
  - dvc
  - src
  - src_ip
  - src_port
  - vendor_product
example_log:
  {
